<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#17414f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Compta">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Compta Médecin</title>
<style>
:root{
  --bg:#f4f3ef; --surface:#fcfcfb; --surface-2:#efede7; --line:#dedbd2;
  --ink:#16201f; --ink-2:#4f5856; --ink-3:#7c8482;
  --brand:#17414f; --brand-2:#235d70; --brand-soft:#e2ecee;
  --s-rec:#2a78d6; --s-dep:#eb6834; --s-sal:#1baf7a;
  --ok:#1f7a45; --ok-bg:#e3f2e8; --warn:#9a5b00; --warn-bg:#fbefd6; --bad:#b3261e; --bad-bg:#fbe5e3;
  --radius:12px; --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.05);
  --nav-w:220px;
  font-family: system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
h1,h2,h3{margin:0;font-weight:650;letter-spacing:-.01em}
h1{font-size:1.45rem} h2{font-size:1.1rem} h3{font-size:.95rem}
a{color:var(--brand-2)}

/* Layout */
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:12px;padding:10px 18px;padding-top:max(10px,env(safe-area-inset-top));background:var(--brand);color:#fff}
.brand{font-weight:700;font-size:1.05rem;letter-spacing:.01em;flex:1}
.brand small{display:block;font-weight:400;opacity:.75;font-size:.75rem}
.top select{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:8px;padding:6px 10px}
.top select option{color:#000}
#nav{position:fixed;top:56px;left:0;bottom:0;width:var(--nav-w);padding:16px 10px;display:flex;flex-direction:column;gap:2px;background:var(--surface);border-right:1px solid var(--line)}
#nav button{display:flex;align-items:center;gap:10px;border:0;background:none;padding:10px 12px;border-radius:9px;cursor:pointer;text-align:left;color:var(--ink-2)}
#nav button svg{width:20px;height:20px;flex:none}
#nav button:hover{background:var(--surface-2)}
#nav button.active{background:var(--brand-soft);color:var(--brand);font-weight:600}
main{margin-left:var(--nav-w);padding:22px 26px 60px;max-width:1180px}

@media (max-width:760px){
  #nav{top:auto;right:0;width:auto;height:auto;flex-direction:row;justify-content:space-around;padding:4px 2px;padding-bottom:max(4px,env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);z-index:30}
  #nav button{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 4px;flex:1;align-items:center;text-align:center}
  main{margin-left:0;padding:14px 12px 96px}
  .top{padding-left:14px;padding-right:14px;gap:8px}
  .brand small{display:none}
  .top select{padding:6px 6px;max-width:42vw}
}
.formerr{background:var(--bad-bg);color:var(--bad);border-radius:9px;padding:10px 12px;margin-bottom:12px;font-weight:550}
.field.invalid input,.field.invalid select{border-color:var(--bad);background:#fff7f6}
.field.invalid label{color:var(--bad)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:7px 14px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--brand);color:#fff}
tr.detail td{background:#f7f6f2;font-size:.85rem}
.synth .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.grid-t{width:100%;border-collapse:collapse;min-width:620px;font-size:.88rem}
.grid-t th,.grid-t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
.grid-t thead th{font-size:.78rem;color:var(--ink-2);background:var(--surface-2)}
.grid-t tbody th{text-align:left;font-weight:500;color:var(--ink-2)}
.grid-t tr.sec th{background:var(--brand-soft);color:var(--brand);font-weight:650;text-align:left}
.grid-t tr.strong th,.grid-t tr.strong td{font-weight:650;color:var(--ink)}
.grid-t td.tot{font-weight:600;background:#f7f6f2}
tr.cur td{background:#f1f6f7}

/* Components */
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.head .sp{flex:1}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));align-items:start}
@media (max-width:760px){.kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi .val{font-size:1.15rem}.card{padding:13px}}
.kpi .lbl{color:var(--ink-2);font-size:.82rem}
.kpi .val{font-size:1.45rem;font-weight:650;margin-top:2px}
.kpi .sub{color:var(--ink-3);font-size:.78rem;margin-top:2px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:9px;cursor:pointer;font-weight:550}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-2)}
.btn.danger{color:var(--bad);border-color:#f0c2be}
.btn.sm{padding:5px 10px;font-size:.85rem}
.btn.ghost{border-color:transparent;background:none}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.78rem;font-weight:600}
.pill.ok{background:var(--ok-bg);color:var(--ok)} .pill.warn{background:var(--warn-bg);color:var(--warn)} .pill.bad{background:var(--bad-bg);color:var(--bad)}
.banner{border-radius:10px;padding:10px 14px;margin-bottom:14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-bg);color:#5c3800}
.banner.info{background:var(--brand-soft);color:var(--brand)}
.banner.bad{background:var(--bad-bg);color:#7a1a14;border:1px solid #f0c2be}
.cum-bad{color:var(--bad);font-weight:650}
.calc-d{margin-top:8px;font-size:.84rem}
.calc-d summary{cursor:pointer;color:var(--brand-2);font-weight:600;list-style-position:inside}
.calc-d table{width:100%;border-collapse:collapse;margin-top:6px}
.calc-d td{padding:3px 0;border-bottom:1px dashed var(--line)}
.calc-d td.num{text-align:right}
.calc-d tr.strong td{font-weight:650;border-bottom:1px solid var(--line)}
.calc-d p{margin:6px 0 0}
.warn-t{color:var(--warn)}
.kpi.treso{grid-column:1/-1}
.grid>*{min-width:0}
html,body{overflow-x:hidden}
.grid-t tfoot th,.grid-t tfoot td{font-weight:650;background:var(--surface-2);border-bottom:0}
.grid-t tr.cur-m td,.grid-t tr.cur-m th{background:#f1f6f7}
.grid-t tr.fut td,.grid-t tr.fut th{color:var(--ink-2);font-style:italic}
.grid-t tbody th .pill{font-style:normal;margin-left:4px}
.neg{color:var(--bad)}
@media (max-width:760px){
  .treso .grid-t{min-width:0}
  .treso .grid-t thead{display:none}
  .treso .grid-t tr{display:grid;grid-template-columns:1fr 1fr;gap:2px 12px;padding:9px 4px;border-bottom:1px solid var(--line)}
  .treso .grid-t th,.treso .grid-t td{border:0;padding:1px 0;text-align:left;white-space:normal;background:none}
  .treso .grid-t tbody th,.treso .grid-t tfoot th{grid-column:1/-1;font-weight:650;color:var(--ink)}
  .treso .grid-t td::before{content:attr(data-l);display:block;font-size:.72rem;color:var(--ink-3);font-style:normal;font-weight:400}
  .treso .grid-t tfoot tr{background:var(--surface-2);border-radius:8px}
  .treso .grid-t tr.cur-m{background:#f1f6f7;border-radius:8px}
}
.muted{color:var(--ink-3)} .small{font-size:.83rem}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:7px 10px}
.empty{text-align:center;padding:40px 16px;color:var(--ink-3)}

/* Tables -> cards on mobile */
table.list{width:100%;border-collapse:collapse;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.list th{text-align:left;font-size:.78rem;font-weight:600;color:var(--ink-2);background:var(--surface-2);padding:9px 12px;white-space:nowrap}
.list td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
.list td.r,.list th.r{text-align:right}
.list tr.row{cursor:pointer}
.list tr.row:hover td{background:#f7f6f2}
.list tfoot td{font-weight:650;background:var(--surface-2)}
@media (max-width:760px){
  table.list,.list tbody,.list tr,.list td,.list tfoot{display:block;width:100%}
  .list thead{display:none}
  table.list{border:0;background:none}
  .list tr{background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:6px 4px}
  .list td{border:0;padding:3px 10px;display:flex;justify-content:space-between;gap:10px}
  .list td.r{text-align:right}
  .list td::before{content:attr(data-l);color:var(--ink-3);font-size:.8rem}
  .list td[data-l=""]::before{content:none}
  .list tfoot tr{background:var(--surface-2)}
}

/* Modal / forms */
.modal{position:fixed;inset:0;background:rgba(10,20,20,.45);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px}
.modal.hidden{display:none}
.sheet{background:var(--surface);border-radius:14px;width:min(720px,100%);max-height:92vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.sheet header{position:sticky;top:0;background:var(--surface);padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;z-index:2}
.sheet header h2{flex:1}
.sheet .body{padding:16px 18px}
.sheet footer{position:sticky;bottom:0;background:var(--surface);padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
.sheet footer .sp{flex:1}
@media (max-width:760px){
  .modal{padding:0;align-items:flex-end}
  .sheet{border-radius:16px 16px 0 0;max-height:94vh}
  .sheet footer{padding-bottom:max(12px,env(safe-area-inset-bottom))}
}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px 14px}
.fgrid .full{grid-column:1/-1}
@media (max-width:560px){.fgrid{grid-template-columns:1fr}}
.field label{display:block;font-size:.82rem;font-weight:600;color:var(--ink-2);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;background:#fff;min-height:42px}
.field textarea{min-height:70px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--brand-2);outline-offset:-1px;border-color:transparent}
.field .hint{font-size:.76rem;color:var(--ink-3);margin-top:3px}
.field input[readonly]{background:var(--surface-2)}
.calc{background:var(--brand-soft);color:var(--brand);border-radius:9px;padding:9px 12px;font-size:.88rem}

/* Charts */
.chart-wrap{position:relative}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-2);margin:6px 0 4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{fill:var(--ink-3);font-size:11px}
.tip{position:absolute;pointer-events:none;background:#111c1b;color:#fff;font-size:.8rem;padding:7px 10px;border-radius:8px;white-space:nowrap;opacity:0;transition:opacity .1s;z-index:5}
.tip b{display:block;margin-bottom:2px}
.hbar{display:grid;grid-template-columns:minmax(120px,1.3fr) 2fr auto;gap:8px 10px;align-items:center;font-size:.85rem}
.hbar .bar{height:10px;border-radius:0 4px 4px 0;background:var(--s-dep)}
.hbar .track{background:var(--surface-2);border-radius:4px}

.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#111c1b;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;transition:.2s;z-index:60;pointer-events:none;max-width:90vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.section-title{margin:22px 0 10px}
.two{grid-template-columns:1.6fr 1fr}
@media (max-width:980px){.two{grid-template-columns:1fr}}
.stack>*+*{margin-top:10px}
.setgrid{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}

/* Print */
.print-only{display:none}
@media print{
  body{background:#fff;font-size:11pt}
  .top,#nav,.no-print,.btn{display:none!important}
  main{margin:0;padding:0;max-width:none}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid}
  .print-only{display:block}
  table.list{border:1px solid #ccc}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Compta Médecin<small id="who"></small></div>
  <select id="perSel" aria-label="Période"></select>
  <select id="yearSel" aria-label="Année"></select>
</header>
<nav id="nav" aria-label="Navigation"></nav>
<main id="view"></main>
<div id="modal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="tip" class="tip"></div>
<div id="toast" class="toast" role="status"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
"use strict";
/* ======================= Constantes ======================= */
const APP_VERSION = 1;
const DB_NAME = "compta-medecin", DB_VER = 1;
const STORES = ["remplacements","salaires","depenses","fichiers","meta"];

const CATEGORIES = [
  ["achats","Achats (consommables, petit matériel médical)"],
  ["loyer","Loyer et charges locatives"],
  ["location","Location de matériel / mobilier"],
  ["entretien","Entretien et réparations"],
  ["personnel","Personnel (salaires, charges)"],
  ["retro_versees","Rétrocessions versées (à vos remplaçants)"],
  ["urssaf","Cotisations sociales obligatoires (URSSAF, CARMF)"],
  ["madelin","Cotisations facultatives (Madelin, prévoyance)"],
  ["csg","CSG déductible"],
  ["cfe","CFE et autres impôts professionnels"],
  ["vehicule","Frais de véhicule / kilométriques"],
  ["deplacement","Déplacements (train, hôtel, parking, péage)"],
  ["repas","Frais de repas"],
  ["formation","Formation, congrès, DPC"],
  ["documentation","Documentation, abonnements, logiciels"],
  ["bureau","Fournitures de bureau, petit informatique"],
  ["telecom","Téléphone, internet"],
  ["assurance","Assurances (RCP, multirisque)"],
  ["ordre","Cotisations professionnelles (Ordre, syndicat)"],
  ["honoraires","Honoraires (comptable, AGA, juriste)"],
  ["banque","Frais bancaires"],
  ["immo","Matériel à amortir (> 500 € HT)"],
  ["autres","Autres frais professionnels"]
];
const CAT = Object.fromEntries(CATEGORIES);
const MODES = ["Virement","Chèque","Carte bancaire","Espèces","Prélèvement","Autre"];
const TYPES_SAL = ["Salaire mensuel","Gardes / astreintes","Vacations","Prime / indemnité","Autre"];
const MOIS = ["janv.","févr.","mars","avr.","mai","juin","juil.","août","sept.","oct.","nov.","déc."];

const DEFAULT_SETTINGS = {
  id:"settings", nom:"", rpps:"", statut:"remplacant", regime:"micro",
  seuilMicro:83600, abattementMicro:34, abattementMin:305, tauxRetroDefaut:70,
  rappelJours:14, lastBackup:null, updatedAt:0,
  regimeSocial:"rspm", urssafPeriodicite:"T", urssafBase:"encaissement", urssafVersement:"suivant",
  rspmSeuil1:19000, rspmTaux1:13.5, rspmSeuil2:38000, rspmTaux2:22, tauxProvision:0,
  impotLibAnnuel:11, impotLibMensuel:12, impotSalariat:7.5,
  declarations:{}
};
const pad = n => String(n).padStart(2,"0");
const pct = n => (+n||0).toLocaleString("fr-FR");

/* ======================= Utilitaires ======================= */
const $ = (s,el=document)=>el.querySelector(s);
const uid = ()=> Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const euro = new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR"});
const eur = n => euro.format(+n||0);
const eur0 = n => new Intl.NumberFormat("fr-FR",{style:"currency",currency:"EUR",maximumFractionDigits:0}).format(+n||0);
const num = v => { if(v===""||v==null) return 0; const n=parseFloat(String(v).replace(/\s/g,"").replace(",",".")); return isFinite(n)?n:0; };
const r2 = n => Math.round((+n||0)*100)/100;
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const today = ()=> new Date().toISOString().slice(0,10);
const fdate = d => d ? new Date(d+"T12:00:00").toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"}) : "—";
const fmonth = p => { if(!p) return "—"; const [y,m]=p.split("-"); return MOIS[+m-1]+" "+y; };
const yearOf = d => d ? +String(d).slice(0,4) : null;
const monthOf = d => d ? +String(d).slice(5,7)-1 : null;
function daysBetween(a,b){ if(!a||!b) return 0; const d=(new Date(b+"T12:00:00")-new Date(a+"T12:00:00"))/864e5; return d>=0? Math.round(d)+1 : 0; }
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }

/* ======================= Base de données (IndexedDB) ======================= */
let db;
function openDB(){
  return new Promise((res,rej)=>{
    const r = indexedDB.open(DB_NAME,DB_VER);
    r.onupgradeneeded = ()=>{ const d=r.result; STORES.forEach(s=>{ if(!d.objectStoreNames.contains(s)) d.createObjectStore(s,{keyPath:"id"}); }); };
    r.onsuccess = ()=>res(r.result);
    r.onerror = ()=>rej(r.error);
  });
}
function idb(store,mode,fn){
  return new Promise((res,rej)=>{
    const t = db.transaction(store,mode), s = t.objectStore(store);
    const req = fn(s);
    t.oncomplete = ()=>res(req && "result" in req ? req.result : undefined);
    t.onerror = ()=>rej(t.error); t.onabort = ()=>rej(t.error);
  });
}
const getAll = s => idb(s,"readonly",st=>st.getAll());
const getOne = (s,id) => idb(s,"readonly",st=>st.get(id));
const putOne = (s,o) => idb(s,"readwrite",st=>st.put(o));
const clearStore = s => idb(s,"readwrite",st=>st.clear());

/* ======================= État ======================= */
const S = { remplacements:[], salaires:[], depenses:[], settings:{...DEFAULT_SETTINGS}, view:"dash", year:new Date().getFullYear(), period:"Y", filters:{} };
const live = arr => arr.filter(x=>!x.deleted);

async function loadAll(){
  for(const s of ["remplacements","salaires","depenses"]) S[s] = await getAll(s);
  const st = await getOne("meta","settings");
  S.settings = {...DEFAULT_SETTINGS, ...(st||{})};
  if(!S.settings.migrBareme22){ // barème demandé : 13,5 % jusqu'à 19 000 €, 22 % jusqu'à 38 000 €, régime simplifié
    Object.assign(S.settings,{rspmSeuil1:19000,rspmTaux1:13.5,rspmSeuil2:38000,rspmTaux2:22,regimeSocial:"rspm",migrBareme22:true});
    if(st) await saveSettings();
  }
}
async function save(store,obj){
  obj.updatedAt = Date.now();
  await putOne(store,obj);
  const arr = S[store]; const i = arr.findIndex(x=>x.id===obj.id);
  if(i>=0) arr[i]=obj; else arr.push(obj);
}
async function softDelete(store,obj){
  if(obj.fichierId){ await putOne("fichiers",{id:obj.fichierId,deleted:true,updatedAt:Date.now()}); }
  await save(store,{...obj,deleted:true});
}
async function saveSettings(){ S.settings.updatedAt=Date.now(); await putOne("meta",S.settings); }

/* ======================= Calculs ======================= */
function rempCalc(r){
  const du = num(r.montantDu), percu = num(r.montantPercu);
  let statut = "attente";
  if(du>0 && percu>=du-0.005) statut="paye"; else if(percu>0) statut="partiel";
  if(du===0 && percu>0) statut="paye";
  return {du,percu,reste:Math.max(0,r2(du-percu)),statut};
}
const STATUT_LBL = {paye:["Payé","ok"],partiel:["Partiel","warn"],attente:["En attente","bad"]};
const salRevenu = s => num(s.netAvantImpot) || (num(s.netPaye)+num(s.impotPreleve)) || num(s.netImposable);
const activiteDate = r => r.dateFin || r.dateDebut;
const depDeductible = d => r2(num(d.montant)*num(d.partPro??100)/100);

/* ---- Période (année / trimestre / mois) ---- */
const PERIODES = [["Y","Année entière"],["Q1","1er trimestre"],["Q2","2e trimestre"],["Q3","3e trimestre"],["Q4","4e trimestre"],
  ...["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"].map((m,i)=>["M"+pad(i+1),m.charAt(0).toUpperCase()+m.slice(1)])];
function periodRange(p=S.period, y=S.year){

const normD = d => !d ? "" : (String(d).length===7 ? d+"-15" : String(d).slice(0,10));
function inP(d){ if(!d) return false; const [a,b]=periodRange(); const s=normD(d); return s>=a && s<=b; }

function yearStats(y, pred=inYear){
  const st = S.settings;
  const months = Array.from({length:12},()=>({rec:0,dep:0,sal:0}));
  let recettes=0, depenses=0, salaires=0, salNetImp=0, salPas=0, jours=0, nbRemp=0;
  const byCat = {}, impayes = [];
  live(S.remplacements).forEach(r=>{
    const c = rempCalc(r);
    if(r.datePaiement && c.percu){ if(yearOf(r.datePaiement)===y) months[monthOf(r.datePaiement)].rec+=c.percu; if(pred(r.datePaiement)) recettes+=c.percu; }
    if(pred(r.dateDebut)){ jours+=num(r.jours); nbRemp++; }
    if(c.reste>0) impayes.push({...r,...c});
  });
  live(S.depenses).forEach(d=>{
    const v = depDeductible(d);
    if(yearOf(d.date)===y) months[monthOf(d.date)].dep+=v;
    if(!pred(d.date)) return;
    depenses+=v; byCat[d.categorie]=(byCat[d.categorie]||0)+v;
  });
  live(S.salaires).forEach(s=>{
    if(yearOf(s.periode)===y) months[monthOf(s.periode)].sal+=salRevenu(s);
    if(!pred(s.periode)) return;
    salaires+=salRevenu(s); salNetImp+=num(s.netImposable); salPas+=num(s.impotPreleve);
  });
  const abat = Math.max(st.abattementMin, recettes*st.abattementMicro/100);

  return {months,recettes:r2(recettes),depenses:r2(depenses),salaires:r2(salaires),salNetImp:r2(salNetImp),salPas:r2(salPas),jours,nbRemp,byCat,impayes,
    benefMicro:r2(benefMicro),benefReel:r2(benefReel),benef:r2(benef),revenuGlobal:r2(benef+salaires),

}

/* ---- Revenus : imposable et net disponible, sur la période sélectionnée ---- */
function revenus(pred=inP){
  const st=S.settings, k=yearStats(S.year,pred);
  // 1. Revenu imposable : bénéfice BNC (recettes encaissées) + net imposable des salaires
  let niSal=0, nbSansNI=0, approx=0;
  live(S.salaires).forEach(s=>{ if(!pred(s.periode)) return;
    if(s.netImposable!==""&&s.netImposable!=null){ niSal+=num(s.netImposable); } else { nbSansNI++; approx+=salRevenu(s); niSal+=salRevenu(s); } });
  const abat = st.regime==="micro" ? Math.max(st.abattementMin, k.recettes*st.abattementMicro/100) : 0;
  const imposable = { recettes:k.recettes, regime:st.regime, abat:r2(Math.min(abat,k.recettes)), depenses:k.depenses, benef:k.benef,
    niSal:r2(niSal), nbSansNI, approx:r2(approx), total:r2(k.benef+niSal) };
  // 2. Revenu net disponible (logique de l'onglet « 2026 » de l'Excel)
  let ca=0, cotP=0, sal=0, pas=0;
  live(S.remplacements).forEach(r=>{ const d=activiteDate(r); if(!pred(d)) return; const c=rempCalc(r); ca+=c.du||c.percu; });
  live(S.depenses).forEach(d=>{ if(d.categorie==="urssaf" && pred(d.date)) cotP+=depDeductible(d); });
  live(S.salaires).forEach(s=>{ if(!pred(s.periode)) return; sal+=salRevenu(s); pas+=num(s.impotPreleve); });
  const libBrut=ca-cotP, impLib=libBrut*st.impotLibAnnuel/100, libNet=libBrut-impLib;
  const aPrelever=sal*st.impotSalariat/100-pas, salNet=sal-pas-aPrelever;
  const net = { ca:r2(ca), cotP:r2(cotP), libBrut:r2(libBrut), impLib:r2(impLib), libNet:r2(libNet), sal:r2(sal), pas:r2(pas), aPrelever:r2(aPrelever), salNet:r2(salNet), total:r2(libNet+salNet) };
  return {imposable, net};
}

/* ---- Trésorerie : ce qui arrive réellement sur le compte, mois par mois ---- */
function tresorerie(y=S.year){
  const st=S.settings, M=()=>Array(12).fill(0), nowM=today().slice(0,7);
  const enc=M(), prev=M(), sal=M(), urs=M(), ursInfo=Array.from({length:12},()=>[]);
  live(S.remplacements).forEach(r=>{ const c=rempCalc(r);
    if(c.percu && r.datePaiement && yearOf(r.datePaiement)===y) enc[monthOf(r.datePaiement)]+=c.percu;
    if(c.reste>0){ const d=activiteDate(r); if(!d) return; let ym=d.slice(0,7); if(ym<nowM) ym=nowM; if(+ym.slice(0,4)===y) prev[+ym.slice(5)-1]+=c.reste; } });
  live(S.salaires).forEach(s=>{ if(yearOf(s.periode)!==y) return; sal[monthOf(s.periode)] += (s.netPaye!==""&&s.netPaye!=null) ? num(s.netPaye) : salRevenu(s)-num(s.impotPreleve); });
  // Estimation URSSAF mensuelle : barème appliqué au CA de chaque mois (date du remplacement), sur le cumul de l'année
  const caM=M(); caPrevu(y).forEach(x=>caM[monthOf(x.d)]+=x.a);
  const s1=st.rspmSeuil1; let cum=0;
  caM.forEach((a,i)=>{ if(!a) return; const before=cum; cum+=a;
    if(st.regimeSocial==="rspm"){
      urs[i]=rspmCotis(cum)-rspmCotis(before);
      const p1=r2(Math.max(0,Math.min(cum,s1)-Math.min(before,s1))), p2=r2(a-p1);
      ursInfo[i].push([p1?`${eur(p1)} × ${pct(st.rspmTaux1)} %`:"", p2?`${eur(p2)} × ${pct(st.rspmTaux2)} %`:""].filter(Boolean).join(" + "));
    } else if(num(st.tauxProvision)){ urs[i]=a*num(st.tauxProvision)/100; ursInfo[i].push(`${eur(a)} × ${pct(st.tauxProvision)} %`); }
  });
  const mois = enc.map((_,i)=>{ const reste=enc[i]+prev[i]+sal[i]-urs[i]; return {i,ym:`${y}-${pad(i+1)}`,enc:r2(enc[i]),prev:r2(prev[i]),sal:r2(sal[i]),urs:r2(urs[i]),info:ursInfo[i],reste:r2(reste)}; });
  return {mois};
}

function synthese(y=S.year){
  const st=S.settings, Q=()=>Array(4).fill(0), q=d=>Math.floor(monthOf(d)/3);
  const ca=Q(), cotR=Q(), cotP=Q(), sal=Q(), ni=Q(), pas=Q();
  live(S.remplacements).forEach(r=>{ const d=activiteDate(r); if(!d||yearOf(d)!==y) return; const c=rempCalc(r); ca[q(d)]+=c.du||c.percu; cotR[q(d)]+=num(r.cotisReelles); });
  live(S.depenses).forEach(d=>{ if(d.categorie==="urssaf" && yearOf(d.date)===y) cotP[q(d.date)]+=depDeductible(d); });
  live(S.salaires).forEach(s=>{ if(yearOf(s.periode)!==y) return; const i=q(s.periode+"-15"); sal[i]+=salRevenu(s); ni[i]+=num(s.netImposable); pas[i]+=num(s.impotPreleve); });
  const sum=a=>a.reduce((x,z)=>x+z,0);
  const cotE=Q(); { let cum=0; for(const x of caPrevu(y)){ const b=cum; cum+=x.a; cotE[q(x.d)]+=rspmCotis(cum)-rspmCotis(b); } }
  const brut = ca.map((v,i)=>v-cotP[i]);
  const libBrut=sum(brut), libNet=libBrut*(1-st.impotLibAnnuel/100);
  const revSal=sum(sal), pasTot=sum(pas), aPrelever=revSal*st.impotSalariat/100-pasTot, salNet=revSal-aPrelever-pasTot;
  const netEstime = revSal + (sum(ca)-sum(cotR))*(1-st.impotLibMensuel/100) - pasTot;
  return {ca,cotR,cotP,cotE,cotETot:sum(cotE),brut,sal,ni,pas,libBrut,libNet,libImpots:libBrut-libNet,revSal,pasTot,aPrelever,salNet,niTot:sum(ni),
    totalNet:libNet+salNet, netEstime, caTot:sum(ca), cotRTot:sum(cotR), cotPTot:sum(cotP)};
}

/* ---- Alerte plafond régime simplifié ---- */
function caPrevu(y=S.year){
  return live(S.remplacements).map(r=>{ const c=rempCalc(r); return {d:activiteDate(r),a:c.du||c.percu,r}; })
    .filter(x=>x.d&&x.a&&yearOf(x.d)===y).sort((a,b)=>a.d.localeCompare(b.d));
}
function rspmAlerte(y=S.year){
  const st=S.settings; if(st.regimeSocial!=="rspm") return "";
  let cum=0, c1=null, c2=null;
  for(const x of caPrevu(y)){ cum+=x.a; if(!c1&&cum>=st.rspmSeuil1) c1=x; if(!c2&&cum>st.rspmSeuil2) c2=x; }
  if(c2) return `<div class="banner bad"><div><b>⚠ Dépassement estimé du plafond du régime simplifié</b><br>
    CA ${y} prévu : <b class="num">${eur(cum)}</b> (remplacements effectués et prévus), soit <b class="num">${eur(cum-st.rspmSeuil2)}</b> au-dessus du plafond de ${eur0(st.rspmSeuil2)}.
    Le plafond est franchi avec le remplacement « ${esc(c2.r.medecin)} » du ${fdate(c2.d)}.
    Au-delà de ce plafond, le régime simplifié n'est plus accessible : à anticiper avec l'URSSAF ou votre comptable.</div></div>`;
  if(c1) return `<div class="banner warn"><div>CA ${y} prévu : <b class="num">${eur(cum)}</b>. Le seuil de ${eur0(st.rspmSeuil1)} est atteint le ${fdate(c1.d)} : au-delà, les cotisations passent à ${pct(st.rspmTaux2)} %.
    Marge restante avant le plafond de ${eur0(st.rspmSeuil2)} : <b class="num">${eur(st.rspmSeuil2-cum)}</b>.</div></div>`;
  return "";
}

/* ---- URSSAF ---- */
function rspmCotis(x){ const st=S.settings; const a=Math.min(x,st.rspmSeuil1), b=Math.max(0,Math.min(x,st.rspmSeuil2)-st.rspmSeuil1), c=Math.max(0,x-st.rspmSeuil2);
  return a*st.rspmTaux1/100 + (b+c)*st.rspmTaux2/100; }
function urssafRows(y=S.year, base){
  const st=S.settings; base = base || st.urssafBase; const mens=st.urssafPeriodicite==="M", n=mens?12:4;
  const amt=Array(n).fill(0), reel=Array(n).fill(0), det=Array.from({length:n},()=>[]);
  live(S.remplacements).forEach(r=>{
    const c=rempCalc(r); let d,a;
    if(base==="encaissement"){ d=r.datePaiement; a=c.percu; } else { d=r.dateFin||r.dateDebut; a=c.du||c.percu; }
    if(!d||!a||yearOf(d)!==y) return;
    const i = mens? monthOf(d) : Math.floor(monthOf(d)/3); amt[i]+=a; reel[i]+=num(r.cotisReelles); det[i].push({...r,...c,_d:d,_a:a});
  });
  const nowS=today(); let cum=0;
  return amt.map((a,i)=>{
    const before=cum; cum+=a;
    const p = mens? "M"+pad(i+1) : "Q"+(i+1);
    const key = `${y}-${mens?"M"+pad(i+1):"T"+(i+1)}`;
    const end = periodRange(p,y)[1];
    const cotis = st.regimeSocial==="rspm" ? rspmCotis(cum)-rspmCotis(before) : a*num(st.tauxProvision)/100;
    const part1 = Math.max(0, Math.min(cum,st.rspmSeuil1)-Math.min(before,st.rspmSeuil1)), part2 = a-part1;
    const allDecl = det[i].length && det[i].every(r=>r.declareUrssaf==="Oui");
    const declared = (st.declarations||{})[key] || (allDecl ? "tous" : null);
    let etat;
    if(declared) etat=[declared==="tous"?"Déclaré":"Déclaré le "+fdate(declared),"ok"];
    else if(nowS<=end && nowS>=periodRange(p,y)[0]) etat=["En cours","warn"];
    else if(nowS<end) etat=["À venir",""];
    else if(a>0) etat=["À déclarer","bad"];
    else etat=["Rien à déclarer",""];
    return {i,p,key,label:Object.fromEntries(PERIODES)[p],amt:r2(a),cum:r2(cum),before:r2(before),part1:r2(part1),part2:r2(part2),cotis:r2(cotis),reel:r2(reel[i]),nbNonDecl:det[i].filter(r=>r.declareUrssaf!=="Oui").length,det:det[i].sort((x,z)=>x._d.localeCompare(z._d)),declared,etat};
  });
}

function allYears(){
  const ys = new Set([new Date().getFullYear()]);
  live(S.remplacements).forEach(r=>{ yearOf(r.dateDebut)&&ys.add(yearOf(r.dateDebut)); yearOf(r.datePaiement)&&ys.add(yearOf(r.datePaiement)); });
  live(S.salaires).forEach(s=>yearOf(s.periode)&&ys.add(yearOf(s.periode)));
  live(S.depenses).forEach(d=>yearOf(d.date)&&ys.add(yearOf(d.date)));
  return [...ys].sort((a,b)=>b-a);
}

function backupBanner(){
  const lb = S.settings.lastBackup, n = live(S.remplacements).length+live(S.salaires).length+live(S.depenses).length;
  if(!n) return "";
  const days = lb ? Math.floor((Date.now()-lb)/864e5) : null;
  if(days!==null && days < S.settings.rappelJours) return "";
  return `<div class="banner warn no-print"><span>⚠ ${days===null?"Aucune sauvegarde réalisée pour l'instant.":`Dernière sauvegarde il y a ${days} jours.`} Les données ne sont stockées que dans ce navigateur.</span><button class="btn sm" data-act="backup">Sauvegarder maintenant</button></div>`;
}

function drawMonthly(el, months){
  const W=640,H=250,L=56,R=8,T=10,B=26, iw=W-L-R, ih=H-T-B;
  const keys=[["rec","var(--s-rec)","Recettes libérales"],["sal","var(--s-sal)","Salaires"],["dep","var(--s-dep)","Dépenses"]];
  const max = Math.max(100,...months.flatMap(m=>[m.rec,m.sal,m.dep]));
  const step = niceStep(max/4), top = Math.ceil(max/step)*step;
  const gw = iw/12, bw = Math.max(3,Math.min(12,(gw-10)/3-2));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Recettes, salaires et dépenses par mois">`;
  for(let v=0; v<=top+0.01; v+=step){ const yy=T+ih-(v/top)*ih; s+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="${v===0?"#b9b5aa":"#e8e6df"}" stroke-width="1"/><text x="${L-6}" y="${yy+4}" text-anchor="end">${v>=1000?(v/1000).toLocaleString("fr-FR")+" k":v}</text>`; }
  months.forEach((m,i)=>{
    const gx = L+i*gw+(gw-(bw*3+4))/2;
    keys.forEach(([k,c],j)=>{ const h=(m[k]/top)*ih; if(h>0){ const x=gx+j*(bw+2), y0=T+ih-h, r=Math.min(4,h,bw/2);
      s+=`<path d="M${x},${T+ih} V${y0+r} Q${x},${y0} ${x+r},${y0} H${x+bw-r} Q${x+bw},${y0} ${x+bw},${y0+r} V${T+ih} Z" fill="${c}"/>`; } });
    s+=`<rect x="${L+i*gw}" y="${T}" width="${gw}" height="${ih}" fill="transparent" data-i="${i}"/>`;
    s+=`<text x="${L+i*gw+gw/2}" y="${H-8}" text-anchor="middle">${MOIS[i].replace(".","")}</text>`;
  });
  s+="</svg>";
  el.innerHTML = s;
  const tip=$("#tip");
  el.querySelectorAll("rect[data-i]").forEach(r=>{
    const show=e=>{ const m=months[+r.dataset.i]; tip.innerHTML=`<b>${MOIS[+r.dataset.i]} ${S.year}</b>`+keys.map(([k,,l])=>`${l} : ${eur(m[k])}`).join("<br>"); tip.style.opacity=1;
      const p=(e.touches?e.touches[0]:e); tip.style.left=Math.min(window.innerWidth-220,p.clientX+12)+"px"; tip.style.top=(p.clientY+window.scrollY-10)+"px"; tip.style.position="absolute"; r.setAttribute("fill","rgba(23,65,79,.06)"); };
    r.addEventListener("mousemove",show); r.addEventListener("touchstart",show,{passive:true});
    r.addEventListener("mouseleave",()=>{tip.style.opacity=0; r.setAttribute("fill","transparent");});
  });
}
function niceStep(x){ const p=Math.pow(10,Math.floor(Math.log10(x))); const f=x/p; return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p; }
function drawCats(el, byCat){
  const arr = Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  if(!arr.length){ el.innerHTML=`<p class="muted small">Aucune dépense sur l'année.</p>`; return; }
  const max = arr[0][1];
  el.innerHTML = `<div class="hbar">${arr.map(([c,v])=>`<span>${esc((CAT[c]||c).split(" (")[0])}</span><div class="track"><div class="bar" style="width:${Math.max(2,v/max*100)}%" title="${esc(CAT[c]||c)} : ${eur(v)}"></div></div><span class="num">${eur(v)}</span>`).join("")}</div>`;
}

    <td class="r num" data-l="${rspm?"Cotisations estimées":"Provision"}">${rspm||num(st.tauxProvision)?`<b>${eur(r.cotis)}</b>`:"—"}${rspm&&r.amt?`<div class="small muted">${r.part1&&r.part2?`${eur(r.part1)} × ${pct(st.rspmTaux1)} % + ${eur(r.part2)} × ${pct(st.rspmTaux2)} %`:r.part2?`${eur(r.part2)} × ${pct(st.rspmTaux2)} %`:`${eur(r.part1)} × ${pct(st.rspmTaux1)} %`}</div>`:""}</td>
    <td class="r num" data-l="Cotisations saisies">${r.reel?eur(r.reel):"—"}</td>
    <td data-l="État">${r.etat[1]?`<span class="pill ${r.etat[1]}">${r.etat[0]}</span>`:`<span class="muted small">${r.etat[0]}</span>`}${!r.declared&&r.det.length&&r.nbNonDecl<r.det.length?`<div class="small muted">${r.det.length-r.nbNonDecl}/${r.det.length} déclaré(s)</div>`:""}</td>
    <td data-l="">${r.declared==="tous"?"":r.declared?`<button class="btn sm ghost" data-decl="${r.key}">Annuler</button>`:(r.etat[0]==="À déclarer"||r.etat[0]==="En cours"||r.amt>0?`<button class="btn sm" data-decl="${r.key}">Marquer déclaré</button>`:"")}</td></tr>
    ${S.filters.ursOpen===r.key?`<tr class="detail"><td colspan="7" data-l="">${r.det.length? r.det.map(d=>`${esc(d.medecin)} · ${fdate(d.dateDebut)} → ${fdate(d.dateFin)} · ${st.urssafBase==="encaissement"?"encaissé le":"terminé le"} ${fdate(d._d)} · <b class="num">${eur(d._a)}</b>${num(d.cotisReelles)?` · cotisations ${eur(d.cotisReelles)}`:""} · ${d.declareUrssaf==="Oui"?"déclaré":"<b>non déclaré</b>"}`).join("<br>") : "Aucun remplacement sur la période."}</td></tr>`:""}`).join("")}</tbody>

function fieldHTML(f,val){
  const id="f_"+f.k, req=f.req?"required":"", v=esc(val??"");
  let inp;
  switch(f.t){
    case "date": inp=`<input type="date" id="${id}" name="${f.k}" value="${v}" ${req}>`; break;
    case "month": inp=`<input type="month" id="${id}" name="${f.k}" value="${v}" ${req}>`; break;
    case "dec": inp=`<input type="text" inputmode="decimal" id="${id}" name="${f.k}" value="${val===""||val==null?"":String(val).replace(".",",")}" ${req} autocomplete="off">`; break;
    case "sel": inp=`<select id="${id}" name="${f.k}" ${req}><option value="">—</option>${f.o.map(o=>{const [k,l]=Array.isArray(o)?o:[o,o]; return `<option value="${esc(k)}" ${val===k?"selected":""}>${esc(l)}</option>`;}).join("")}</select>`; break;
    case "area": inp=`<textarea id="${id}" name="${f.k}">${v}</textarea>`; break;
    case "file": inp=`<input type="file" id="${id}" name="${f.k}" accept="image/*,application/pdf"><div class="hint" id="fileInfo"></div>`; break;
    default: inp=`<input type="text" id="${id}" name="${f.k}" value="${v}" ${req} placeholder="${esc(f.ph||"")}">`;
  }
  return `<div class="field ${f.full?"full":""}"><label for="${id}">${esc(f.l)}${f.req?" *":""}</label>${inp}${f.hint&&f.t!=="file"?`<div class="hint">${esc(f.hint)}</div>`:""}</div>`;
}
function openForm(store, obj){
  const def = FORMS[store], isNew = !obj;
  if(isNew){
    obj = {id:uid()};
    if(store==="remplacements"){ obj.taux=S.settings.tauxRetroDefaut; }
    if(store==="depenses"){ obj.date=today(); obj.partPro=100; }
    if(store==="remplacements"){ obj.declareUrssaf="Non"; }
    if(store==="salaires"){ obj.periode=today().slice(0,7); obj.type=TYPES_SAL[0]; const last=live(S.salaires).sort((a,b)=>(b.periode||"").localeCompare(a.periode||""))[0]; if(last) obj.etablissement=last.etablissement; }
  }
  const m=$("#modal");
  m.innerHTML = `<form class="sheet" id="theForm" novalidate>
    <header><h2>${isNew?"Nouveau · ":""}${def.title}</h2><button type="button" class="btn ghost" data-close aria-label="Fermer">✕</button></header>
    <div class="body"><div class="fgrid">${def.fields.map(f=>fieldHTML(f,obj[f.k])).join("")}</div>
    ${store==="remplacements"?`<div class="calc" id="rempCalc" style="margin-top:12px"></div>`:""}
    ${store==="depenses"?`<div class="calc" id="depCalc" style="margin-top:12px"></div>`:""}</div>
    <footer>${!isNew?`<button type="button" class="btn danger" data-del>Supprimer</button>`:""}<span class="sp"></span>
      <button type="button" class="btn" data-close>Annuler</button><button type="submit" class="btn primary">Enregistrer</button></footer></form>`;
  m.classList.remove("hidden");
  const form=$("#theForm");
  let newFile=null;

  if(store==="remplacements"){
    let duManual = !!obj.montantDu && !(num(obj.honoraires)&&Math.abs(num(obj.honoraires)*num(obj.taux)/100-num(obj.montantDu))<0.01);
    const upd=(src)=>{
      const g=n=>form.elements[n];
      if((src==="dateDebut"||src==="dateFin") && g("dateDebut").value && g("dateFin").value){ g("jours").value = daysBetween(g("dateDebut").value,g("dateFin").value); }
      if(src==="montantDu") duManual = g("montantDu").value!=="";
      if((src==="honoraires"||src==="taux") && !duManual && num(g("honoraires").value)) g("montantDu").value = String(r2(num(g("honoraires").value)*num(g("taux").value)/100)).replace(".",",");
      if(src==="montantPercu" && num(g("montantPercu").value) && !g("datePaiement").value) g("datePaiement").value=today();
      const c = rempCalc({montantDu:g("montantDu").value,montantPercu:g("montantPercu").value});
      $("#rempCalc").innerHTML = `Statut : <b>${STATUT_LBL[c.statut][0]}</b>${c.reste?` · reste à encaisser <b class="num">${eur(c.reste)}</b>`:""}${num(g("jours").value)&&c.du?` · <span class="num">${eur(c.du/num(g("jours").value))}</span> / jour`:""}`;
    };
    form.addEventListener("input",e=>upd(e.target.name)); upd();
  }
  if(store==="salaires"){
    const g=n=>form.elements[n];
    form.addEventListener("input",e=>{ if(e.target.name==="netAvantImpot"||e.target.name==="impotPreleve"){ if(num(g("netAvantImpot").value)) g("netPaye").value=String(r2(num(g("netAvantImpot").value)-num(g("impotPreleve").value))).replace(".",","); } });
  }
  if(store==="depenses"){
    const upd=()=>{ const g=n=>form.elements[n].value; $("#depCalc").innerHTML=`Montant déductible : <b class="num">${eur(depDeductible({montant:g("montant"),partPro:g("partPro")===""?100:g("partPro")}))}</b>${g("categorie")==="immo"?" · Un matériel de plus de 500 € HT s'amortit normalement sur plusieurs années (module immobilisations en V2).":""}`; };
    form.addEventListener("input",upd); form.addEventListener("change",upd); upd();
    const info=$("#fileInfo");
    if(obj.fichierId) getOne("fichiers",obj.fichierId).then(f=>{ if(f&&!f.deleted) info.innerHTML=`Actuel : <a href="#" data-file="${obj.fichierId}">${esc(f.name)}</a> — choisir un fichier le remplace`; });
    form.elements.justificatif.addEventListener("change",async e=>{
      const file=e.target.files[0]; if(!file) return;
      newFile = file.type.startsWith("image/") ? await compressImage(file) : file;
      info.textContent = `${file.name} · ${(newFile.size/1024).toFixed(0)} Ko`;
    });
  }

  const showErr = (msg, el)=>{
    let box=form.querySelector(".formerr"); if(!box){ box=document.createElement("div"); box.className="formerr"; box.setAttribute("role","alert"); form.querySelector(".body").prepend(box); }
    box.innerHTML=msg; (el||box).scrollIntoView({block:"center",behavior:"smooth"}); if(el) setTimeout(()=>el.focus({preventScroll:true}),300);
  };
  form.addEventListener("submit",async e=>{
    e.preventDefault();
    form.querySelectorAll(".field.invalid").forEach(x=>x.classList.remove("invalid"));
    const manquants = def.fields.filter(f=>f.req && !String(form.elements[f.k].value).trim());
    if(manquants.length){
      manquants.forEach(f=>form.elements[f.k].closest(".field").classList.add("invalid"));
      showErr(`Pour enregistrer, complétez : <b>${manquants.map(f=>esc(f.l)).join(", ")}</b>.${manquants.some(f=>f.t==="date"||f.t==="month")?"<br><span class='small'>Une date doit être entière (jour, mois et année).</span>":""}`, form.elements[manquants[0].k]);
      return;
    }
    const btn=form.querySelector("button[type=submit]"); btn.disabled=true;
    try{
    const o = {...obj};
    def.fields.forEach(f=>{ if(f.t==="file") return; const val=form.elements[f.k].value; o[f.k] = f.t==="dec" ? (val===""?"":num(val)) : val.trim(); });
    if(store==="remplacements" && o.dateDebut && o.dateFin && o.dateFin<o.dateDebut){ form.elements.dateFin.closest(".field").classList.add("invalid"); showErr("La date de fin « Au » est avant la date de début « Du ».", form.elements.dateFin); btn.disabled=false; return; }
    if(store==="depenses" && o.partPro==="") o.partPro=100;
    if(newFile){
      if(o.fichierId) await putOne("fichiers",{id:o.fichierId,deleted:true,updatedAt:Date.now()});
      o.fichierId=uid(); await putOne("fichiers",{id:o.fichierId,name:newFile.name||"justificatif",type:newFile.type,blob:newFile,updatedAt:Date.now()});
    }
    await save(store,o); closeModal(); toast("Enregistré"); render();
    }catch(err){
      btn.disabled=false;
      showErr(`L'enregistrement a échoué : ${esc(err&&err.message||err)}<br><span class="small">Si le fichier est ouvert dans un aperçu (application Claude, e-mail…), ouvrez-le directement dans Chrome.</span>`);
    }
  });
  m.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeModal);
  const del=m.querySelector("[data-del]");
  if(del) del.onclick=async()=>{ if(!confirm("Supprimer cet élément ?")) return; await softDelete(store,obj); closeModal(); toast("Supprimé"); render(); };
  setTimeout(()=>{ const first=form.querySelector("input:not([type=file]),select"); if(first && window.innerWidth>760 && !form.contains(document.activeElement)) first.focus(); },50);
}
function closeModal(){ const m=$("#modal"); m.classList.add("hidden"); m.innerHTML=""; }
$("#modal").addEventListener("mousedown",e=>{ if(e.target.id==="modal") closeModal(); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && !$("#modal").classList.contains("hidden")) closeModal(); });

async function compressImage(file){
  try{
    const bmp = await createImageBitmap(file);
    const max=1600, sc=Math.min(1,max/Math.max(bmp.width,bmp.height));
    const c=document.createElement("canvas"); c.width=Math.round(bmp.width*sc); c.height=Math.round(bmp.height*sc);
    c.getContext("2d").drawImage(bmp,0,0,c.width,c.height);
    const blob = await new Promise(r=>c.toBlob(r,"image/jpeg",0.8));
    if(!blob || blob.size>file.size) return file;
    return new File([blob], file.name.replace(/\.\w+$/,"")+".jpg", {type:"image/jpeg"});
  }catch(_){ return file; }
}
async function openFile(id){
  const f = await getOne("fichiers",id);
  if(!f||!f.blob){ toast("Justificatif introuvable"); return; }
  const url = URL.createObjectURL(f.blob);
  const w = window.open(url,"_blank");
  if(!w){ const a=document.createElement("a"); a.href=url; a.download=f.name; a.click(); }
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

/* ======================= Sauvegarde / import ======================= */
const blobToDataURL = b => new Promise((res,rej)=>{ const r=new FileReader(); r.onload=()=>res(r.result); r.onerror=()=>rej(r.error); r.readAsDataURL(b); });
async function dataURLToBlob(u){ return (await fetch(u)).blob(); }
async function buildBackup(){
  const fichiers=[];
  for(const f of await getAll("fichiers")){
    fichiers.push(f.blob? {id:f.id,name:f.name,type:f.type,updatedAt:f.updatedAt,data:await blobToDataURL(f.blob)} : {id:f.id,deleted:true,updatedAt:f.updatedAt});
  }
  const data = { app:"compta-medecin", version:APP_VERSION, exportedAt:new Date().toISOString(),
    remplacements:await getAll("remplacements"), salaires:await getAll("salaires"), depenses:await getAll("depenses"),
    settings:S.settings, fichiers };
  const name = `compta-medecin-sauvegarde-${today()}.json`;
  return new File([JSON.stringify(data)], name, {type:"application/json"});
}
async function markBackup(){ S.settings.lastBackup=Date.now(); await saveSettings(); }
function download(file){ const url=URL.createObjectURL(file); const a=document.createElement("a"); a.href=url; a.download=file.name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),5000); }
async function doBackup(){ const f=await buildBackup(); download(f); await markBackup(); toast("Sauvegarde téléchargée"); render(); }
async function doShare(){
  const f=await buildBackup();
  try{ if(navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f],title:"Sauvegarde Compta Médecin"}); await markBackup(); toast("Sauvegarde partagée"); render(); } else download(f); }
  catch(e){ if(e.name!=="AbortError") toast("Partage impossible : "+e.message); }
}
async function doImport(file){
  let data; try{ data=JSON.parse(await file.text()); }catch(_){ toast("Fichier illisible"); return; }
  if(data.app!=="compta-medecin"){ toast("Ce fichier n'est pas une sauvegarde Compta Médecin"); return; }
  let added=0, updated=0;
  for(const s of ["remplacements","salaires","depenses"]){
    for(const rec of data[s]||[]){
      const cur = await getOne(s,rec.id);
      if(!cur){ await putOne(s,rec); if(!rec.deleted) added++; }
      else if((rec.updatedAt||0) > (cur.updatedAt||0)){ await putOne(s,rec); updated++; }
    }
  }
  for(const f of data.fichiers||[]){
    const cur = await getOne("fichiers",f.id);
    if(cur && (cur.updatedAt||0) >= (f.updatedAt||0)) continue;
    await putOne("fichiers", f.deleted? {id:f.id,deleted:true,updatedAt:f.updatedAt} : {id:f.id,name:f.name,type:f.type,updatedAt:f.updatedAt,blob:await dataURLToBlob(f.data)});
  }
  if(data.settings && (data.settings.updatedAt||0) > (S.settings.updatedAt||0)){ const lb=S.settings.lastBackup; S.settings={...DEFAULT_SETTINGS,...data.settings,lastBackup:lb}; await putOne("meta",S.settings); }
  await loadAll(); render();
  toast(`Import terminé : ${added} ajout(s), ${updated} mise(s) à jour`);
}
$("#importFile").addEventListener("change",e=>{ const f=e.target.files[0]; if(f) doImport(f); e.target.value=""; });

/* ======================= Exports CSV ======================= */
function csv(rows){
  const cell = v => { if(typeof v==="number") return String(v).replace(".",","); const s=String(v??""); return /[;"\n]/.test(s)? '"'+s.replace(/"/g,'""')+'"' : s; };
  return "﻿"+rows.map(r=>r.map(cell).join(";")).join("\r\n");
}
function exportCSV(kind){
  const y=periodLabel().replace(/\s+/g,"-").normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase(); let rows, name;
  if(kind==="journal"){
    name=`livre-journal-recettes-${y}.csv`;
    rows=[["Date d'encaissement","Origine","Client / médecin","Mode de paiement","Montant (€)"]];
    live(S.remplacements).filter(r=>inP(r.datePaiement)&&num(r.montantPercu)).sort((a,b)=>a.datePaiement.localeCompare(b.datePaiement))
      .forEach(r=>rows.push([fdate(r.datePaiement),`Rétrocession remplacement ${fdate(r.dateDebut)} au ${fdate(r.dateFin)}`,r.medecin,r.modePaiement||"",r2(num(r.montantPercu))]));
  } else if(kind==="remplacements"){
    name=`remplacements-${y}.csv`;
    rows=[["Début","Fin","Médecin remplacé","Lieu","Jours","Honoraires (€)","Taux (%)","Rétrocession due (€)","Perçu (€)","Encaissé le","Mode","Statut","Cotisations URSSAF (€)","Déclaré URSSAF","Notes"]];
    live(S.remplacements).filter(r=>inP(r.dateDebut)||inP(r.datePaiement)||inP(r.dateFin)).sort((a,b)=>(a.dateDebut||"").localeCompare(b.dateDebut||""))
      .forEach(r=>{const c=rempCalc(r); rows.push([fdate(r.dateDebut),fdate(r.dateFin),r.medecin,r.lieu||"",num(r.jours),num(r.honoraires),num(r.taux),c.du,c.percu,r.datePaiement?fdate(r.datePaiement):"",r.modePaiement||"",STATUT_LBL[c.statut][0],num(r.cotisReelles),r.declareUrssaf||"Non",r.notes||""]);});
  } else if(kind==="depenses"){
    name=`depenses-${y}.csv`;
    rows=[["Date","Libellé","Catégorie","Montant TTC (€)","Part pro (%)","Déductible (€)","Mode","Justificatif","Notes"]];
    live(S.depenses).filter(d=>inP(d.date)).sort((a,b)=>a.date.localeCompare(b.date))
      .forEach(d=>rows.push([fdate(d.date),d.libelle,CAT[d.categorie]||d.categorie,num(d.montant),num(d.partPro??100),depDeductible(d),d.modePaiement||"",d.fichierId?"oui":"non",d.notes||""]));
  } else {
    name=`salaires-hospitaliers-${y}.csv`;
    rows=[["Mois","Établissement","Type","Avant impôt (€)","Impôt prélevé (€)","Net versé (€)","Net imposable (€)","Versé le","Notes"]];
    live(S.salaires).filter(s=>inP(s.periode)).sort((a,b)=>a.periode.localeCompare(b.periode))
      .forEach(s=>rows.push([fmonth(s.periode),s.etablissement,s.type||"",salRevenu(s),num(s.impotPreleve),num(s.netPaye),num(s.netImposable),s.dateVersement?fdate(s.dateVersement):"",s.notes||""]));
  }
  download(new File([csv(rows)],name,{type:"text/csv;charset=utf-8"}));
  toast(`${rows.length-1} ligne(s) exportée(s)`);
}

/* ======================= Délégation des clics ======================= */
document.addEventListener("click",async e=>{
  const t=e.target.closest("[data-new],[data-edit],[data-go],[data-act],[data-csv],[data-file],[data-per],[data-decl],[data-urs]");
  if(!t) return;
  if(t.dataset.per){ S.settings.urssafPeriodicite=t.dataset.per; S.filters.ursOpen=null; await saveSettings(); render(); return; }
  if(t.dataset.decl){ const k=t.dataset.decl, d={...(S.settings.declarations||{})};
    if(d[k]){ delete d[k]; } else { const v=prompt("Date de la déclaration (JJ/MM/AAAA)", new Date().toLocaleDateString("fr-FR")); if(v===null) return;
      const m=v.trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); d[k]= m? `${m[3]}-${pad(m[2])}-${pad(m[1])}` : today(); }
    S.settings.declarations=d; await saveSettings(); render(); return; }
  if(t.dataset.urs){ S.filters.ursOpen = S.filters.ursOpen===t.dataset.urs? null : t.dataset.urs; render(); return; }
  if(t.dataset.file){ e.preventDefault(); e.stopPropagation(); openFile(t.dataset.file); return; }
  if(t.dataset.new) return openForm(t.dataset.new);
  if(t.dataset.edit){ const [s,id]=t.dataset.edit.split(":"); return openForm(s, S[s].find(x=>x.id===id)); }
  if(t.dataset.go){ S.view=t.dataset.go; render(); window.scrollTo(0,0); return; }
  if(t.dataset.csv) return exportCSV(t.dataset.csv);
  const a=t.dataset.act;
  if(a==="backup") return doBackup();
  if(a==="share") return doShare();
  if(a==="import") return $("#importFile").click();
  if(a==="print") return window.print();
  if(a==="wipe"){
    if(prompt('Pour tout effacer sur cet appareil, tapez EFFACER')!=="EFFACER") return;
    for(const s of STORES) await clearStore(s);
    await loadAll(); render(); toast("Données effacées");
  }
});
document.addEventListener("change",e=>{ const f=e.target.dataset&&e.target.dataset.filter; if(f){ F[f]=e.target.value; render(); } });

window.addEventListener("unhandledrejection",e=>toast("Erreur : "+(e.reason&&e.reason.message||e.reason)));
/* ---- Version installable (téléphone) : uniquement quand l'app est servie depuis un site web ---- */
if(/^https?:$/.test(location.protocol)){
  const l=document.createElement("link"); l.rel="manifest"; l.href="manifest.webmanifest"; document.head.appendChild(l);
  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("sw.js").then(reg=>{
      reg.addEventListener("updatefound",()=>{ const w=reg.installing; w&&w.addEventListener("statechange",()=>{ if(w.state==="installed"&&navigator.serviceWorker.controller) toast("Nouvelle version téléchargée : elle sera active à la prochaine ouverture."); }); });
    }).catch(()=>{});
  }
}
